name: Platform smoke

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  whisper:
    name: ${{ matrix.name }} / real FFmpeg and whisper.cpp
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"
          rustc --version --verbose

      - name: Select Python for the smoke harness
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: smoke-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Windows media dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Install Linux media and sandbox dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap espeak-ng ffmpeg tesseract-ocr
          bwrap --version
          espeak-ng --version
          ffmpeg -version
          ffprobe -version

      - name: Install macOS build and media dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Build SubBake
        run: cargo build -p subbake-cli

      - name: Run full workspace tests
        run: cargo test --workspace --no-fail-fast

      - name: Run fresh install and transcription smoke test
        run: python scripts/ci/platform_smoke.py

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-${{ runner.os }}-${{ runner.arch }}
          path: target/platform-smoke-logs
          if-no-files-found: ignore
          retention-days: 7
