name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MSRV: "1.88.0"
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  msrv:
    name: Linux / MSRV check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the minimum supported Rust version
        run: |
          rustup toolchain install "${{ env.MSRV }}" --profile minimal
          rustc "+${{ env.MSRV }}" --version --verbose

      - name: Check every target with the locked dependency graph
        run: cargo "+${{ env.MSRV }}" check --workspace --all-targets --locked

  linux-quality:
    name: Linux / format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select pinned Rust with lint and format components
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal --component clippy,rustfmt
          rustup default "${{ env.RUST_TOOLCHAIN }}"
          rustc --version
          cargo --version

      - name: Install command sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user -- true

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  platform:
    name: ${{ matrix.name }} / lint and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select pinned Rust with Clippy
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal --component clippy
          rustup default "${{ env.RUST_TOOLCHAIN }}"
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Run platform Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run platform tests
        run: cargo test --workspace --no-fail-fast

      - name: Check CLI without the interactive agent
        run: cargo check -p subbake-cli --all-targets --no-default-features
