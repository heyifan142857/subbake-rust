name: Security and licenses

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  audit:
    name: RustSec and dependency policy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"

      - name: Cache audit tools and registries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry
            ~/.cargo/git
          key: security-${{ runner.os }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned audit tools
        shell: bash
        run: |
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit --version 0.22.2
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny --version 0.20.2

      - name: Audit vulnerabilities
        run: cargo audit

      - name: Check licenses, duplicate versions, and sources
        run: cargo deny check licenses bans sources
