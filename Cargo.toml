[workspace]
members = [
  "crates/subbake-core",
  "crates/subbake-adapters",
  "crates/subbake-agent",
  "crates/subbake-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
authors = ["azote <azote.h2@gmail.com>"]
repository = "https://github.com/heyifan142857/subbake-rust"
publish = false

[workspace.dependencies]
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
