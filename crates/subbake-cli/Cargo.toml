[package]
name = "subbake-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sbake"
path = "src/main.rs"

[lib]
name = "subbake_cli"
path = "src/lib.rs"

[features]
default = ["agent"]
agent = ["dep:subbake-agent"]

[dependencies]
serde_json = "1"
subbake-adapters = { path = "../subbake-adapters" }
subbake-agent = { path = "../subbake-agent", optional = true }
subbake-core = { path = "../subbake-core" }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[lints]
workspace = true
