[package]
name = "subbake-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
    "scrolling-regions",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subbake-adapters = { version = "=0.2.0-alpha.1", path = "../subbake-adapters" }
subbake-core = { version = "=0.2.0-alpha.1", path = "../subbake-core" }
unicode-segmentation = "1.12"
thiserror = "2"

[dev-dependencies]
portable-pty = "0.9"
proptest = "1"
tempfile.workspace = true
vt100 = "0.16.2"

[lints]
workspace = true
